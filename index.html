<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5ef"><title>liquidglass1021 · 初版 / 终版</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#263c32;font:12px Arial,"Microsoft YaHei",sans-serif}.toolbar{height:64px;padding:0 24px;border-bottom:1px solid #d8ddd2;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:14px;letter-spacing:1px;font-weight:500;margin:0}.switcher{display:flex;gap:4px;padding:4px;border:1px solid #d8ddd2;border-radius:26px}a{color:inherit;text-decoration:none}.switcher a{padding:9px 17px;border-radius:22px;white-space:nowrap}.switcher a[aria-current=page]{background:#2d4434;color:#fffef5}.switcher a:focus-visible,.direct:focus-visible{outline:2px solid #c36b38;outline-offset:3px}.direct{font-size:11px;color:#6e7d61}iframe{display:block;width:100%;height:calc(100dvh - 64px);border:0;background:#f5f5ef}@media(max-width:600px){.toolbar{padding:0 12px}h1{font-size:11px}.switcher a{font-size:10px;padding:8px 11px}.direct{display:none}}</style></head>
<body><header class="toolbar"><h1>liquidglass1021</h1><nav class="switcher" aria-label="选择实现版本"><a href="?mode=initial" data-mode="initial">初版 · SVG</a><a href="?mode=final" data-mode="final">终版 · WebGL2</a></nav><a class="direct" id="direct" href="modes/final.html" target="_blank" rel="noopener">独立打开当前模式 ↗</a></header><iframe id="demo" title="液态玻璃演示 · 终版"></iframe>
<script>
const frame=document.querySelector('#demo'),direct=document.querySelector('#direct'),links=[...document.querySelectorAll('[data-mode]')];
function selectMode(mode,remember=true){mode=mode==='initial'?'initial':'final';const path='modes/'+mode+'.html';if(frame.getAttribute('src')!==path)frame.src=path;frame.title='液态玻璃演示 · '+(mode==='initial'?'初版':'终版');direct.href=path;links.forEach(a=>{if(a.dataset.mode===mode)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(remember){try{localStorage.setItem('liquidglass1021-mode',mode)}catch{}history.replaceState(null,'','?mode='+mode)}}
let saved='final';try{saved=localStorage.getItem('liquidglass1021-mode')||'final'}catch{}
selectMode(new URLSearchParams(location.search).get('mode')||saved,false);
links.forEach(a=>a.addEventListener('click',e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();selectMode(a.dataset.mode)}));
</script></body></html>
